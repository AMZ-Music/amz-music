<!DOCTYPE html>
<html lang="es">

<head>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMZ Admin</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
background:#D4AF37;
border:none;
padding:12px 20px;
font-weight:bold;
cursor:pointer;
}

textarea{
width:100%;
height:200px;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h1>Panel Administrador AMZ</h1>

<input id="artistId" placeholder="ID del artista (ej: grupo1)">
<input id="artistName" placeholder="Nombre del artista">
<input id="artistLogo" placeholder="Ruta del logo (img/logo.png)">

<button onclick="generateArtist()">Generar artista</button>
<button onclick="generateQR()">Generar QR</button>
<div id="qrcode" style="margin-top:30px;"></div>

<textarea id="result"></textarea>

</div>

<script>

function generateArtist(){

let id = document.getElementById("artistId").value
let name = document.getElementById("artistName").value
let logo = document.getElementById("artistLogo").value

let json = `"${id}": {
"name": "${name}",
"logo": "${logo}",
"songs": [
{
"title": "Canción 1",
"preview": "audio/preview.mp3",
"file": "audio/song.mp3"
}
]
}`

document.getElementById("result").value = json

}





function generateQR(){

let artistId = document.getElementById("artistId").value

let url = "http://192.168.100.10:5500/artist.html?artist=" + artistId

document.getElementById("qrcode").innerHTML = ""

new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 200,
    height: 200
})

}

</script>

</body>

</html>
